<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ENERGE - Hesaplama Araçları</title>
    <link rel="icon" type="image/png" href="gelogosaydam.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        html, body { width: 100%; min-height: 100vh; background-color: #121212; color: #e0e0e0; }
        body { display: flex; justify-content: center; align-items: center; padding: 15px; }
        
        .card { background-color: #1e1e1e; width: 100%; max-width: 420px; padding: 20px; border-radius: 16px; border: 1px solid #E87D0A; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .history-btn { background: #2a2a2a; border: 1px solid #3a3a3a; color: #E87D0A; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 1.2rem; position: relative; display: flex; justify-content: center; align-items: center; }
        .badge { position: absolute; top: -5px; right: -5px; background: #E87D0A; color: #fff; font-size: 0.7rem; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        
        .logo-container { flex-grow: 1; text-align: center; display: flex; justify-content: center; align-items: center; }
        .logo-img { max-height: 60px; width: auto; object-fit: contain; }
        .header-spacer { width: 40px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: #2a2a2a; color: #aaa; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #E87D0A; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #aaa; }
        input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 6px; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #E87D0A; }

        .profile-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        .profile-row input { flex: 1; }
        .btn-del-row { background: #ff5555; color: #fff; border: none; border-radius: 6px; width: 36px; height: 38px; cursor: pointer; font-weight: bold; flex-shrink: 0; }
        .btn-add-row { width: 100%; background: #2a2a2a; border: 1px dashed #E87D0A; color: #E87D0A; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 12px; }

        .result-box { margin-top: 15px; padding: 15px; background: #E87D0A; border-radius: 8px; text-align: center; color: #fff; }
        .result-value { font-size: 1.4rem; font-weight: bold; margin: 5px 0; }
        .result-details { font-size: 0.85rem; text-align: left; border-top: 1px dashed rgba(255,255,255,0.4); padding-top: 8px; margin-top: 8px; line-height: 1.5; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .action-btn { flex: 1; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid #fff; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .footer { text-align: center; font-size: 0.8rem; color: #666; margin-top: 15px; }
        
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:100; }
        .modal-content { background:#1e1e1e; width:90%; max-width:400px; border-radius:12px; padding:15px; max-height:80vh; overflow-y:auto; border:1px solid #E87D0A; }
        .item { background:#2a2a2a; border-left:3px solid #E87D0A; padding:12px; margin-bottom:10px; border-radius:6px; position:relative; }
        .item-title { font-weight: bold; color: #fff; font-size: 0.95rem; }
        .item-sub { color: #aaa; font-size: 0.8rem; margin-top: 4px; white-space: pre-line; line-height: 1.4; }
        .item-actions { display: flex; gap: 6px; margin-top: 8px; }
        .item-btn { padding: 6px 10px; background: #3a3a3a; border: 1px solid #555; color: #fff; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .item-btn-del { background: #552222; border-color: #ff5555; color: #ff5555; }
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <div class="header">
        <button type="button" class="history-btn" id="btnToggleModal" data-html2canvas-ignore>📒 <span class="badge" id="badgeCount">0</span></button>
        <div class="logo-container">
            <img src="gelogosaydam.png" alt="ENERGE" class="logo-img" onerror="this.replaceWith(Object.assign(document.createElement('div'), {innerText: 'ENERGE', style: 'font-size: 1.6rem; font-weight: 900; color: #E87D0A; letter-spacing: 1px;'}))">
        </div>
        <div class="header-spacer" data-html2canvas-ignore></div>
    </div>

    <div class="tabs" data-html2canvas-ignore>
        <button type="button" class="tab-btn active" id="btnGunes" data-target="gunes">Güneş Paneli</button>
        <button type="button" class="tab-btn" id="btnKosegen" data-target="kosegen">Köşegen</button>
    </div>

    <div id="secGunes" class="tab-content active">
        <div class="input-group">
            <label>Hazır Panel Tipi</label>
            <select id="pTip">
                <option value="550">550W (Genişlik: 113.4 cm)</option>
                <option value="585">585W (Genişlik: 113.4 cm)</option>
                <option value="custom">Özel Ölçü Girişi</option>
            </select>
        </div>
        <div class="input-group" id="grpOzelGenislik" style="display: none;">
            <label>Panel Genişliği (cm)</label>
            <input type="number" id="pGen" value="113.4" step="any">
        </div>
        <div class="input-group">
            <label>Panel Gücü (Watt)</label>
            <input type="number" id="pWatt" value="550">
        </div>
        <div class="input-group">
            <label>Toplam Panel Sayısı</label>
            <input type="number" id="pAdet" value="20">
        </div>
        <div class="input-group">
            <label>Sıra Sayısı (Altlı-Üstlü Bloklar)</label>
            <input type="number" id="pSira" value="1">
        </div>

        <div class="input-group">
            <label>Stoktaki Aşık Profilleri (Boy ve Adet)</label>
            <div id="asikContainer">
                <div class="profile-row">
                    <input type="number" class="asik-boy" placeholder="Boy (m)" value="6" step="any">
                    <input type="number" class="asik-adet" placeholder="Adet" value="4">
                    <button type="button" class="btn-del-row" data-action="remove-row" data-html2canvas-ignore>✕</button>
                </div>
            </div>
            <button type="button" class="btn-add-row" id="btnAddRow" data-html2canvas-ignore>＋ Aşık Boyu Ekle</button>
        </div>

        <div class="input-group">
            <label>Tek Taraf Kanat Boyu / Aşık Taşması (cm)</label>
            <input type="number" id="pKanat" value="50" step="any">
        </div>
        <div class="input-group">
            <label>İki Ayak / Kiriş Arası Açıklık (cm)</label>
            <input type="number" id="pAyak" value="250" step="any">
        </div>

        <div class="result-box">
            <div>Toplam Aşık Boyu (Uçtan Uca)</div>
            <div class="result-value" id="outGunesBoy">0 cm</div>
            <div class="result-details" id="outGunesDetay"></div>
            
            <div class="btn-group" data-html2canvas-ignore>
                <button type="button" class="action-btn" id="btnSaveData">💾 Kaydet</button>
                <button type="button" class="action-btn" id="btnCopySummary">📋 Kopyala</button>
            </div>
        </div>
    </div>

    <div id="secKosegen" class="tab-content">
        <div class="input-group">
            <label>Birim</label>
            <select id="kBirim">
                <option value="mm">mm</option>
                <option value="cm" selected>cm</option>
                <option value="m">m</option>
            </select>
        </div>
        <div class="input-group">
            <label>1. Kenar Uzunluğu</label>
            <input type="number" id="k1" placeholder="5" step="any">
        </div>
        <div class="input-group">
            <label>2. Kenar Uzunluğu</label>
            <input type="number" id="k2" placeholder="10" step="any">
        </div>
        <div class="result-box">
            <div>Köşegen (Çapraz)</div>
            <div class="result-value" id="outKosegen">0 cm</div>
        </div>
    </div>
    
    <div style="margin-top: 15px;" data-html2canvas-ignore>
        <button type="button" class="action-btn" id="btnDownloadCard" style="width: 100%; background: #E87D0A; border-color: #E87D0A;">⬇️ Kartı Görüntü Olarak İndir</button>
    </div>

    <div class="footer">ENERGE - Güneş Enerji Sistemleri</div>
</div>

<div class="modal" id="myModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3>Kayıtlı Hesaplamalar</h3>
            <button type="button" id="btnCloseModal" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button>
        </div>
        <div id="listArea"></div>
        <button type="button" class="action-btn" id="btnClearAll" style="width:100%; background:#2a1a1a; border:1px solid #552222; color:#ff5555; margin-top:10px;">🗑️ Tümünü Sil</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    let currentCalc = null;

    function runKosegen() {
        const u = document.getElementById("kBirim").value;
        const a = parseFloat(document.getElementById("k1").value) || 0;
        const b = parseFloat(document.getElementById("k2").value) || 0;
        const res = document.getElementById("outKosegen");
        if (res) {
            if (a > 0 && b > 0) {
                res.innerText = Math.sqrt((a * a) + (b * b)).toFixed(2) + " " + u;
            } else {
                res.innerText = "0 " + u;
            }
        }
    }

    function runGunes() {
        const genislik = parseFloat(document.getElementById("pGen").value) || 113.4;
        const watt = parseFloat(document.getElementById("pWatt").value) || 0;
        const toplamPanel = parseInt(document.getElementById("pAdet").value) || 0;
        const sira = parseInt(document.getElementById("pSira").value) || 1;
        const kanat = parseFloat(document.getElementById("pKanat").value) || 0;
        const ayakAciklik = parseFloat(document.getElementById("pAyak").value) || 0;

        const boyInputs = document.querySelectorAll(".asik-boy");
        const adetInputs = document.querySelectorAll(".asik-adet");
        let stokMetreMetraj = 0;
        const stokListesiMetin = [];

        for (let i = 0; i < boyInputs.length; i++) {
            const b = parseFloat(boyInputs[i].value) || 0;
            const a = parseInt(adetInputs[i].value) || 0;
            if (b > 0 && a > 0) {
                stokMetreMetraj += (b * a);
                stokListesiMetin.push(a + " ad × " + b + "m");
            }
        }

        if (genislik > 0 && toplamPanel > 0 && sira > 0) {
            const panelYanYana = Math.ceil(toplamPanel / (2 * sira));
            const toplamAsik = sira * 4;
            const toplamSonlandirici = sira * 8;
            const toplamKwp = (toplamPanel * watt) / 1000;
            
            const ustSiraPanel = Math.ceil(toplamPanel / (2 * sira));
            const altSiraPanel = Math.floor(toplamPanel / (2 * sira));
            
            const ustBirlesim = Math.max(0, ustSiraPanel - 1);
            const altBirlesim = Math.max(0, altSiraPanel - 1);
            
            const toplamAraTutucu = (ustBirlesim + altBirlesim) * 2 * sira;
            const isTekSayi = (toplamPanel % 2 !== 0);

            const siraAraBosluk = Math.max(0, panelYanYana - 1);
            const panelDizilimCm = (panelYanYana * genislik) + (siraAraBosluk * 2) + 10;
            const toplamAsikBoyuCm = panelDizilimCm + (kanat * 2);
            const toplamAsikBoyuM = (toplamAsikBoyuCm / 100);

            const toplamGerekenMetrajM = toplamAsikBoyuM * toplamAsik;
            const farkM = stokMetreMetraj - toplamGerekenMetrajM;

            let ayakCiftiSayisi = 0;
            if (ayakAciklik > 0) {
                const aciklikSayisi = Math.ceil(panelDizilimCm / ayakAciklik);
                ayakCiftiSayisi = (aciklikSayisi + 1) * sira;
            }

            const boyOut = document.getElementById("outGunesBoy");
            if (boyOut) boyOut.innerText = toplamAsikBoyuCm.toFixed(1) + " cm (" + toplamAsikBoyuM.toFixed(2) + " m)";
            
            const tekSayiNotu = isTekSayi ? ' (Tek sayı panel)' : '';
            const stokMetni = stokListesiMetin.length > 0 ? stokListesiMetin.join(", ") : "Girilmedi";
            const metrajDurumu = farkM >= 0 
                ? '✓ Stok Yeterli (Artan: ' + farkM.toFixed(2) + ' m)' 
                : '⚠ Stok Yetersiz (Eksik: ' + Math.abs(farkM).toFixed(2) + ' m)';

            const detailHTML = 
                '• Sistem Toplam Gücü: <strong>' + toplamKwp.toFixed(2) + ' kWp</strong> (' + watt + 'W × ' + toplamPanel + ')<br>' +
                '• Yan Yana Panel Sayısı: <strong>' + panelYanYana + ' adet</strong><br>' +
                '• Toplam Aşık Hat Sayısı: <strong>' + toplamAsik + ' hat</strong> (' + sira + ' sıra × 4)<br>' +
                '• Toplam Net Profil İhtiyacı: <strong>' + toplamGerekenMetrajM.toFixed(2) + ' m</strong><br>' +
                '• Girilen Aşık Stok: <strong>' + stokMetni + '</strong> (Toplam: ' + stokMetreMetraj.toFixed(2) + ' m)<br>' +
                '• Durum: <strong>' + metrajDurumu + '</strong><br>' +
                '• Toplam Sonlandırıcı: <strong>' + toplamSonlandirici + ' adet</strong><br>' +
                '• Toplam Ara Tutucu: <strong>' + toplamAraTutucu + ' adet</strong>' + tekSayiNotu + '<br>' +
                '• Gereken Ayak Çifti: <strong>' + ayakCiftiSayisi + ' adet</strong><br>' +
                '• Çift Taraf Kanat Taşması: <strong>' + (kanat * 2).toFixed(1) + ' cm</strong>';

            const detayOut = document.getElementById("outGunesDetay");
            if (detayOut) detayOut.innerHTML = detailHTML;

            currentCalc = {
                title: toplamAsikBoyuCm.toFixed(1) + " cm | " + toplamKwp.toFixed(2) + " kWp",
                details: detailHTML.replace(/<br>/g, "\n").replace(/<[^>]*>/g, "")
            };
        }
    }

    function panelTipDegisti() {
        const val = document.getElementById("pTip").value;
        const ozelGrup = document.getElementById("grpOzelGenislik");

        if (val === "550") {
            document.getElementById("pGen").value = 113.4;
            document.getElementById("pWatt").value = 550;
            if (ozelGrup) ozelGrup.style.display = "none";
        } else if (val === "585") {
            document.getElementById("pGen").value = 113.4;
            document.getElementById("pWatt").value = 585;
            if (ozelGrup) ozelGrup.style.display = "none";
        } else if (val === "custom") {
            if (ozelGrup) ozelGrup.style.display = "block";
        }
        runGunes();
    }

    function switchTab(target) {
        document.getElementById("secGunes").className = "tab-content";
        document.getElementById("secKosegen").className = "tab-content";
        document.getElementById("btnGunes").className = "tab-btn";
        document.getElementById("btnKosegen").className = "tab-btn";

        if (target === "gunes") {
            document.getElementById("secGunes").className = "tab-content active";
            document.getElementById("btnGunes").className = "tab-btn active";
            runGunes();
        } else {
            document.getElementById("secKosegen").className = "tab-content active";
            document.getElementById("btnKosegen").className = "tab-btn active";
            runKosegen();
        }
    }

    function addProfileRow() {
        const container = document.getElementById("asikContainer");
        const row = document.createElement("div");
        row.className = "profile-row";
        row.innerHTML = '<input type="number" class="asik-boy" placeholder="Boy (m)" step="any">' +
                        '<input type="number" class="asik-adet" placeholder="Adet">' +
                        '<button type="button" class="btn-del-row" data-action="remove-row" data-html2canvas-ignore>✕</button>';
        container.appendChild(row);
        runGunes();
    }

    function executeCopy(text) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Metin panoya kopyalandı!");
            }).catch(() => { fallbackCopy(text); });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const t = document.createElement("textarea");
        t.value = text;
        t.style.position = "fixed";
        t.style.opacity = "0";
        document.body.appendChild(t);
        t.select();
        try { document.execCommand("copy"); alert("Metin panoya kopyalandı!"); } catch (e) { alert("Kopyalama başarısız."); }
        document.body.removeChild(t);
    }

    function saveData() {
        if (!currentCalc) return;
        let data = [];
        try { data = JSON.parse(localStorage.getItem("ges_data") || "[]"); } catch(e) { data = []; }
        data.unshift(currentCalc);
        if (data.length > 10) data.pop();
        try { localStorage.setItem("ges_data", JSON.stringify(data)); } catch(e) {}
        updateUI();
        alert("Hesaplama geçmişe kaydedildi.");
    }

    function copyTextSummary() {
        const detailsText = document.getElementById("outGunesDetay").innerText;
        const boyText = document.getElementById("outGunesBoy").innerText;
        const summary = "ENERGE GES HESAPLAMA ÖZETİ\nToplam Aşık Boyu: " + boyText + "\n" + detailsText;
        executeCopy(summary);
    }

    function updateUI() {
        let data = [];
        try { data = JSON.parse(localStorage.getItem("ges_data") || "[]"); } catch(e) { data = []; }
        const badge = document.getElementById("badgeCount");
        if (badge) badge.innerText = data.length;
        const box = document.getElementById("listArea");
        if (!box) return;
        box.innerHTML = "";

        if (data.length === 0) {
            box.innerHTML = '<div style="text-align:center; color:#888; padding:15px;">Kayıtlı hesaplama bulunmuyor.</div>';
            return;
        }

        for (let i = 0; i < data.length; i++) {
            const d = data[i];
            const el = document.createElement("div");
            el.className = "item";
            el.innerHTML = '<div class="item-title">' + d.title + '</div>' +
                           '<div class="item-sub">' + d.details + '</div>' +
                           '<div class="item-actions">' +
                               '<button type="button" class="item-btn" data-action="copy-history" data-index="' + i + '">📋 Kopyala</button>' +
                               '<button type="button" class="item-btn item-btn-del" data-action="delete-history" data-index="' + i + '">🗑️ Sil</button>' +
                           '</div>';
            box.appendChild(el);
        }
    }

    function copyHistoryItem(index) {
        let data = [];
        try { data = JSON.parse(localStorage.getItem("ges_data") || "[]"); } catch(e) {}
        if (data[index]) {
            const d = data[index];
            executeCopy("ENERGE GES HESAPLAMA KAYDI\n" + d.title + "\n" + d.details);
        }
    }

    function deleteHistoryItem(index) {
        let data = [];
        try { data = JSON.parse(localStorage.getItem("ges_data") || "[]"); } catch(e) {}
        if (data.length > index) {
            data.splice(index, 1);
            try { localStorage.setItem("ges_data", JSON.stringify(data)); } catch(e) {}
            updateUI();
        }
    }

    function clearAll() {
        if (confirm("Tüm kayıtlar silinsin mi?")) {
            try { localStorage.removeItem("ges_data"); } catch(e) {}
            updateUI();
        }
    }

    function toggleModal(open) {
        const modal = document.getElementById("myModal");
        if (modal) {
            modal.style.display = open ? "flex" : "none";
            if (open) updateUI();
        }
    }
    
    function downloadCardImage() {
        const btn = document.getElementById("btnDownloadCard");
        const originalText = btn.innerText;
        btn.innerText = "⏳ Hazırlanıyor...";
        
        const card = document.getElementById("mainCard");
        
        html2canvas(card, {
            backgroundColor: "#1e1e1e",
            scale: 2,
            logging: false,
            useCORS: true
        }).then(canvas => {
            const link = document.createElement("a");
            link.download = "ENERGE_Hesaplama.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
            btn.innerText = originalText;
        }).catch(() => {
            alert("Görüntü oluşturulamadı.");
            btn.innerText = originalText;
        });
    }

    document.getElementById("pTip").onchange = panelTipDegisti;
    document.getElementById("kBirim").onchange = runKosegen;
    document.getElementById("k1").oninput = runKosegen;
    document.getElementById("k2").oninput = runKosegen;

    document.getElementById("btnGunes").onclick = () => switchTab("gunes");
    document.getElementById("btnKosegen").onclick = () => switchTab("kosegen");
    document.getElementById("btnAddRow").onclick = addProfileRow;
    document.getElementById("btnSaveData").onclick = saveData;
    document.getElementById("btnCopySummary").onclick = copyTextSummary;

    document.getElementById("btnToggleModal").onclick = () => toggleModal(true);
    document.getElementById("btnCloseModal").onclick = () => toggleModal(false);
    document.getElementById("btnClearAll").onclick = clearAll;
    
    document.getElementById("btnDownloadCard").onclick = downloadCardImage;

    document.addEventListener("input", function(e) {
        if (e.target.closest("#secGunes")) {
            runGunes();
        }
    });

    document.addEventListener("click", function(e) {
        const target = e.target;
        const action = target.getAttribute("data-action");

        if (action === "remove-row") {
            const row = target.closest(".profile-row");
            if (row) {
                row.parentNode.removeChild(row);
                runGunes();
            }
        } else if (action === "copy-history") {
            const idx = parseInt(target.getAttribute("data-index"));
            copyHistoryItem(idx);
        } else if (action === "delete-history") {
            const idx = parseInt(target.getAttribute("data-index"));
            deleteHistoryItem(idx);
        }
    });

    runGunes();
    updateUI();
});
</script>
</body>
</html>
