<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hesaplama Araçları</title>
    <link rel="icon" type="image/png" href="GE Logo Saydam.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            position: relative;
            background-color: #1e1e1e;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #E87D0A;
        }

        /* Header / Logo */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-btn {
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #E87D0A;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            font-size: 1.2rem;
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #E87D0A;
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container {
            flex-grow: 1;
            text-align: center;
        }

        .logo-container img {
            max-width: 130px;
            height: auto;
            display: inline-block;
        }

        .header-spacer {
            width: 40px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #3a3a3a;
            padding-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background-color: #2a2a2a;
            color: #a0a0a0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #E87D0A;
            color: #ffffff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Unit Selector */
        .unit-selector {
            position: absolute;
            top: 155px;
            right: 25px;
        }

        .unit-select {
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            padding: 6px 24px 6px 10px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23ffffff' height='12' viewBox='0 0 24 24' width='12' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-align: center;
            color: #ffffff;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #a0a0a0;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 2px solid #3a3a3a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #E87D0A;
        }

        /* Result Box */
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background-color: #E87D0A;
            border-radius: 8px;
            text-align: center;
        }

        .result-title {
            font-size: 0.8rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffffff;
        }

        .result-details {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #ffffff;
            border-top: 1px dashed rgba(255,255,255,0.4);
            padding-top: 8px;
            text-align: left;
            line-height: 1.4;
        }

        .save-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: #888888;
            margin-top: 20px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-content {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 420px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            border-top: 2px solid #E87D0A;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .history-item {
            background-color: #2a2a2a;
            border-left: 4px solid #E87D0A;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            position: relative;
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #888888;
            margin-bottom: 4px;
        }

        .history-item-title {
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
        }

        .history-item-sub {
            font-size: 0.8rem;
            color: #aaaaaa;
            margin-top: 2px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .clear-all-btn {
            width: 100%;
            padding: 12px;
            background-color: #2a1a1a;
            border: 1px solid #552222;
            color: #ff5555;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-container">
            <button class="history-btn" id="openHistoryBtn">
                ⏱️
                <span class="badge" id="historyBadge">0</span>
            </button>

            <div class="logo-container">
                <img src="GE Logo Saydam.png" alt="Logo">
            </div>

            <div class="header-spacer"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="sekmeDegistir('gunes')">Güneş Paneli</button>
            <button class="tab-btn" onclick="sekmeDegistir('kosegen')">Köşegen</button>
        </div>

        <!-- 1. SEKME -->
        <div id="tab-gunes" class="tab-content active">
            <h1>Güneş Paneli Hesaplayıcı</h1>

            <div class="input-group">
                <label for="panelGenislik">Panel Genişliği (cm)</label>
                <input type="tel" id="panelGenislik" value="113.5" inputmode="decimal" onfocus="this.select()" oninput="hesaplaGunes()">
            </div>

            <div class="input-group">
                <label for="panelWatt">Panel Gücü (Watt)</label>
                <input type="tel" id="panelWatt" value="550" inputmode="numeric" onfocus="this.select()" oninput="hesaplaGunes()">
            </div>

            <div class="input-group">
                <label for="toplamPanelSayisi">Toplam Panel Sayısı</label>
                <input type="tel" id="toplamPanelSayisi" value="20" inputmode="numeric" onfocus="this.select()" oninput="hesaplaGunes()">
            </div>

            <div class="input-group">
                <label for="siraSayisi">Sıra Sayısı (Altlı-Üstlü Bloklar)</label>
                <input type="tel" id="siraSayisi" value="1" inputmode="numeric" onfocus="this.select()" oninput="hesaplaGunes()">
            </div>

            <div class="input-group">
                <label for="kanatBoyu">Tek Taraf Kanat Boyu / Aşık Taşması (cm)</label>
                <input type="tel" id="kanatBoyu" value="50" inputmode="decimal" onfocus="this.select()" oninput="hesaplaGunes()">
            </div>

            <div class="input-group">
                <label for="ayakMesafe">İki Ayak / Kiriş Arası Açıklık (cm)</label>
                <input type="tel" id="ayakMesafe" value="250" inputmode="decimal" onfocus="this.select()" oninput="hesaplaGunes()">
            </div>

            <div class="result-box">
                <div class="result-title">Toplam Aşık Boyu (Uçtan Uca)</div>
                <div class="result-value" id="toplamGenislik">0 cm</div>
                <div class="result-details" id="panelDetaylar"></div>
                <button class="save-btn" onclick="kaydetGunes()">💾 Hesaplamayı Kaydet</button>
            </div>
        </div>

        <!-- 2. SEKME -->
        <div id="tab-kosegen" class="tab-content">
            <div class="unit-selector">
                <select id="birimSelect" class="unit-select" onchange="birimDegisti()">
                    <option value="mm">mm</option>
                    <option value="cm" selected>cm</option>
                    <option value="m">m</option>
                </select>
            </div>

            <h1 style="padding-right: 40px;">Köşegen Hesaplayıcı</h1>

            <div class="input-group">
                <label id="label1" for="kenar1">1. Kenar Uzunluğu (cm)</label>
                <input type="tel" id="kenar1" placeholder="Örn: 5" inputmode="decimal" onfocus="this.select()" oninput="hesaplaKosegen()">
            </div>

            <div class="input-group">
                <label id="label2" for="kenar2">2. Kenar Uzunluğu (cm)</label>
                <input type="tel" id="kenar2" placeholder="Örn: 10" inputmode="decimal" onfocus="this.select()" oninput="hesaplaKosegen()">
            </div>

            <div class="result-box">
                <div class="result-title">Köşegen (Çapraz)</div>
                <div class="result-value" id="sonucKosegen">0 cm</div>
            </div>
        </div>

        <div class="footer-text">
            ENERGE - Güneş Enerji Sistemleri
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Kayıtlı Hesaplamalar (<span id="modalCount">0</span>/10)</h3>
                <button class="modal-close" id="closeHistoryBtn">&times;</button>
            </div>
            <div id="historyList"></div>
            <button class="clear-all-btn" onclick="tumunuSil()">🗑️ Tümünü Sil</button>
        </div>
    </div>

    <script>
        let sonGunesHesap = null;

        document.addEventListener("DOMContentLoaded", function() {
            hesaplaGunes();
            gecmisiGuncelleUI();

            document.getElementById('openHistoryBtn').onclick = modalAc;
            document.getElementById('closeHistoryBtn').onclick = modalKapat;
            
            document.getElementById('historyModal').onclick = function(e) {
                if(e.target === this) modalKapat();
            };
        });

        function sekmeDegistir(sekme) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if(sekme === 'gunes') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-gunes').classList.add('active');
                hesaplaGunes();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-kosegen').classList.add('active');
                hesaplaKosegen();
            }
        }

        function birimDegisti() {
            const birim = document.getElementById('birimSelect').value;
            document.getElementById('label1').innerText = `1. Kenar Uzunluğu (${birim})`;
            document.getElementById('label2').innerText = `2. Kenar Uzunluğu (${birim})`;
            hesaplaKosegen();
        }

        function hesaplaKosegen() {
            const birim = document.getElementById('birimSelect').value;
            const a = parseFloat(document.getElementById('kenar1').value.replace(',', '.')) || 0;
            const b = parseFloat(document.getElementById('kenar2').value.replace(',', '.')) || 0;
            const sonucEkrani = document.getElementById('sonucKosegen');

            if (a > 0 && b > 0) {
                const kosegen = Math.sqrt((a * a) + (b * b));
                sonucEkrani.innerText = kosegen.toFixed(2).replace('.', ',') + " " + birim;
            } else {
                sonucEkrani.innerText = "0 " + birim;
            }
        }

        function hesaplaGunes() {
            const genislik = parseFloat(document.getElementById('panelGenislik').value.replace(',', '.')) || 0;
            const watt = parseFloat(document.getElementById('panelWatt').value.replace(',', '.')) || 0;
            const toplamPanel = parseInt(document.getElementById('toplamPanelSayisi').value) || 0;
            const sira = parseInt(document.getElementById('siraSayisi').value) || 0;
            const kanat = parseFloat(document.getElementById('kanatBoyu').value.replace(',', '.')) || 0;
            const ayakAciklik = parseFloat(document.getElementById('ayakMesafe').value.replace(',', '.')) || 0;

            if (genislik > 0 && toplamPanel > 0 && sira > 0) {
                const panelYanYana = Math.ceil(toplamPanel / (2 * sira));
                const toplamAsik = sira * 4;
                const toplamSonlandirici = sira * 8;
                const toplamKwp = (toplamPanel * watt) / 1000;
                
                let toplamAraTutucu = Math.max(0, toplamPanel - (4 * sira));
                const isTekSayi = (toplamPanel % 2 !== 0);
                if (isTekSayi) toplamAraTutucu = Math.max(0, toplamAraTutucu - 2);

                const siraAraBosluk = Math.max(0, panelYanYana - 1);
                const panelDizilimCm = (panelYanYana * genislik) + (siraAraBosluk * 2) + (2 * 5);
                const toplamAsikBoyuCm = panelDizilimCm + (kanat * 2);
                const toplamAsikBoyuM = (toplamAsikBoyuCm / 100).toFixed(2).replace('.', ',');

                let ayakCiftiSayisi = 0;
                if (ayakAciklik > 0) {
                    const aciklikSayisi = Math.ceil(panelDizilimCm / ayakAciklik);
                    ayakCiftiSayisi = (aciklikSayisi + 1) * sira;
                }

                document.getElementById('toplamGenislik').innerText = `${toplamAsikBoyuCm.toFixed(1).replace('.', ',')} cm (${toplamAsikBoyuM} m)`;
                
                const tekSayiNotu = isTekSayi ? ' <span style="font-size:0.75rem; opacity:0.9;">(Tek sayı panel düzeltmesi: -2 adet)</span>' : '';

                document.getElementById('panelDetaylar').innerHTML = `
                    • Sistem Toplam Gücü: <strong>${toplamKwp.toFixed(2).replace('.', ',')} kWp</strong> (${watt}W × ${toplamPanel})<br>
                    • Yan Yana Panel Sayısı: <strong>${panelYanYana} adet</strong> (Sıra başı)<br>
                    • Toplam Panel: <strong>${toplamPanel} adet</strong><br>
                    • Toplam Aşık Sayısı: <strong>${toplamAsik} adet</strong> (${sira} sıra × 4)<br>
                    • Toplam Sonlandırıcı (5cm): <strong>${toplamSonlandirici} adet</strong> (${sira} sıra × 8)<br>
                    • Toplam Ara Tutucu (2cm): <strong>${toplamAraTutucu} adet</strong>${tekSayiNotu}<br>
                    • Gereken Ayak Çifti (Kiriş): <strong>${ayakCiftiSayisi} adet</strong> (${sira} sıra)<br>
                    • Çift Taraf Kanat Taşması: <strong>${(kanat * 2).toFixed(1).replace('.', ',')} cm</strong> (${kanat}cm × 2)
                `;

                sonGunesHesap = {
                    baslik: `${toplamAsikBoyuCm.toFixed(1).replace('.', ',')} cm • ${toplamKwp.toFixed(2).replace('.', ',')} kWp`,
                    detay: `${toplamPanel} panel × ${watt}W • ${sira} sıra • ${panelYanYana} yan yana`,
                    tarih: new Date().toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
                };
            }
        }

        function kaydetGunes() {
            if (!sonGunesHesap) return;
            let kayitlar = JSON.parse(localStorage.getItem('hesapGecmisi') || '[]');
            
            kayitlar.unshift(sonGunesHesap);
            if (kayitlar.length > 10) kayitlar.pop();
            
            localStorage.setItem('hesapGecmisi', JSON.stringify(kayitlar));
            gecmisiGuncelleUI();
            alert("Hesaplama başarıyla kaydedildi.");
        }

        function gecmisiGuncelleUI() {
            let kayitlar = JSON.parse(localStorage.getItem('hesapGecmisi') || '[]');
            document.getElementById('historyBadge').innerText = kayitlar.length;
            document.getElementById('modalCount').innerText = kayitlar.length;

            const listElem = document.getElementById('historyList');
            listElem.innerHTML = '';

            if (kayitlar.length === 0) {
                listElem.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">Kayıtlı hesaplama bulunmuyor.</div>';
                return;
            }

            kayitlar.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div
